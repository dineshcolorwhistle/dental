# HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;

    server_name labs.sarvadent.com *.labs.sarvadent.com;

    location ~ /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    return 301 https://$host$request_uri;
}

# Main HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name labs.sarvadent.com *.labs.sarvadent.com;

    ssl_certificate /etc/letsencrypt/live/labs.sarvadent.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/labs.sarvadent.com/privkey.pem;

    # Recommended SSL Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    access_log /var/log/nginx/labs_access.log;
    error_log /var/log/nginx/labs_error.log;

    root /home/sarvadent-labs/htdocs/labs.sarvadent.com/dental/frontend/dist;
    index index.html;

    # =========================================================================
    # 1. Zero-Cache for SPA Entrypoint & Manifests (Fixes Cache Issue)
    # Always fetch index.html, version.json, and sw.js fresh from the server
    # so clients instantly load new deployments without hard refresh.
    # =========================================================================
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        expires -1;
    }

    location ~* (sw\.js|version\.json)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        expires -1;
    }

    # =========================================================================
    # 2. Immutable Cache for Hashed Assets
    # Vite bundles have unique content hashes in filenames (e.g. index-B87aOdLt.js).
    # These can safely be cached for 1 year because filenames change on each build.
    # =========================================================================
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # =========================================================================
    # 3. Frontend SPA Routing Fallback
    # Client-side routes (e.g. /login, /work-orders) fall back to index.html.
    # =========================================================================
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        expires -1;
    }

    # =========================================================================
    # 4. Backend API
    # =========================================================================
    location /api {
        proxy_pass http://127.0.0.1:7500;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # =========================================================================
    # 5. Swagger
    # =========================================================================
    location /api-docs {
        proxy_pass http://127.0.0.1:7500/api-docs;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================================================================
    # 6. Socket.IO / WebSockets
    # =========================================================================
    location /socket.io/ {
        proxy_pass http://127.0.0.1:7500;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400;
    }

    # =========================================================================
    # 7. LetsEncrypt
    # =========================================================================
    location ~ /.well-known {
        allow all;
        auth_basic off;
    }
}
